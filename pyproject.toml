[project]
name = "napari-dmc-brainmap"
version = "0.1.8"
description = "DMC-BrainMap is an end-to-end tool for multi-feature brain mapping across species"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Felix Jung", email = "jung.neurosc@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "bg-atlasapi==1.0.2",
    "distinctipy==1.3.4",
    "imagecodecs==2025.3.30",
    "magicgui==0.8.1",
    "matplotlib==3.10.9",
    "mergedeep==1.3.4",
    "napari>=0.7.0",
    "natsort==8.4.0",
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "pandas==2.3.3",
    "platformdirs==4.10.1",
    "qtpy==2.4.1",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.0",
    "scikit-spatial==9.0.1",
    "seaborn==0.12.2",
    "shapely==2.1.2",
    "scipy==1.17.1",
    "tifffile==2023.2.28",
]


[project.optional-dependencies]
prediction = [
    "torch>=2.12.0",
]


[dependency-groups]
dev = [
    "pyqt6",
]
test = [
    "pytest",
    "pytest-cov",
]


[project.entry-points."napari.manifest"]
napari-dmc-brainmap = "napari_dmc_brainmap:napari.yaml"


[build-system]
requires = ["setuptools>=77.0.0", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = [
    "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "napari_dmc_brainmap.deprecated",
    "napari_dmc_brainmap.deprecated.*",
]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
