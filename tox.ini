[tox]
envlist = py311, py312, py313
isolated_build = true
requires =
    tox-uv>=1

[testenv]
description = run the test suite with its minimal runtime dependencies
skip_install = true
passenv =
    CI
    DISPLAY
    GITHUB_ACTIONS
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    XAUTHORITY
setenv =
    PYTHONPATH = {toxinidir}/src
    QT_QPA_PLATFORM = offscreen
deps =
    brainglobe-atlasapi==3.0.1
    distinctipy==1.3.4
    imagecodecs==2026.3.6
    joblib==1.5.3
    magicgui==0.10.2
    matplotlib==3.10.9
    mergedeep==1.3.4
    napari>=0.7.0,<0.9
    natsort==8.4.0
    numpy==2.4.6
    opencv-python==4.13.0.92
    pandas==2.3.3
    platformdirs==4.10.1
    probeinterface==0.3.2
    pyqt6
    pytest
    pytest-cov
    pydantic>=2.2,<3
    qtpy==2.4.3
    scikit-image==0.26.0
    scikit-learn==1.9.0
    scikit-spatial==9.0.1
    seaborn==0.13.2
    shapely==2.1.2
    scipy==1.17.1
    superqt==0.8.2
    tifffile==2026.3.3
commands =
    pytest -v --color=yes --cov=napari_dmc_brainmap --cov-report=xml

[testenv:py311-full]
description = install the complete package dependency graph and run the tests
basepython = python3.11
skip_install = false
setenv =
    QT_QPA_PLATFORM = offscreen
deps =
    pyqt6
    pytest
    pytest-cov

[testenv:py312-full]
description = install the complete package dependency graph on Python 3.12 and run the tests
basepython = python3.12
skip_install = false
setenv =
    QT_QPA_PLATFORM = offscreen
deps =
    pyqt6
    pytest
    pytest-cov

[testenv:py313-full]
description = install the complete package dependency graph on Python 3.13 and run the tests
basepython = python3.13
skip_install = false
setenv =
    QT_QPA_PLATFORM = offscreen
deps =
    pyqt6
    pytest
    pytest-cov
