[tox]
envlist = py311
isolated_build = true
requires =
    tox-uv>=1

[gh-actions]
python =
    3.11: py311

[testenv]
description = run the test suite with its minimal runtime dependencies
skip_install = true
passenv =
    CI
    DISPLAY
    GITHUB_ACTIONS
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    XAUTHORITY
setenv =
    PYTHONPATH = {toxinidir}/src
    QT_QPA_PLATFORM = offscreen
deps =
    bg-atlasapi==1.0.2
    distinctipy==1.3.4
    magicgui==0.8.1
    matplotlib==3.10.9
    mergedeep==1.3.4
    napari>=0.7.0
    natsort==8.4.0
    numpy==2.4.6
    opencv-python==4.13.0.92
    pandas==2.3.3
    pyqt6
    pytest
    pytest-cov
    qtpy==2.4.1
    scikit-image==0.26.0
    scikit-learn==1.6.1
    scikit-spatial==9.0.1
    seaborn==0.12.2
    shapely==2.1.2
    tifffile==2023.2.28
commands =
    pytest -v --color=yes --cov=napari_dmc_brainmap --cov-report=xml

[testenv:py311-full]
description = install the complete package dependency graph and run the tests
skip_install = false
setenv =
    QT_QPA_PLATFORM = offscreen
deps =
    pytest
    pytest-cov
