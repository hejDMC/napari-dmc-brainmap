name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} (${{ matrix.tox-env }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            python-version: '3.11'
            tox-env: py311-full
            coverage: true
          - platform: windows-latest
            python-version: '3.11'
            tox-env: py311
            coverage: false
          - platform: macos-15
            python-version: '3.11'
            tox-env: py311
            coverage: false
          - platform: ubuntu-latest
            python-version: '3.13'
            tox-env: py313-full
            coverage: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xfixes0 \
            libxcb-cursor0 \
            libopengl0

      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-uv

      - name: Test with tox on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m tox -e "${{ matrix.tox-env }}"

      - name: Test with tox
        if: runner.os != 'Linux'
        run: python -m tox -e "${{ matrix.tox-env }}"

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
